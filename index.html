<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneLastChanc3 | Cinematic Portfolio</title>
    <meta
      name="description"
      content="A cinematic, premium portfolio landing page with minimalist monochrome styling and elegant motion."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="scene" id="scene">
        <div class="atmosphere" aria-hidden="true"></div>
        <div class="ambient ambient-top" aria-hidden="true"></div>
        <div class="ambient ambient-center" aria-hidden="true"></div>
        <div class="light-beam light-beam-primary" id="beamPrimary" aria-hidden="true"></div>
        <div class="light-beam light-beam-secondary" id="beamSecondary" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="flash-burst" id="flashBurst" aria-hidden="true"></div>

        <main class="hero" aria-label="Portfolio hero">
          <div class="hero-group" id="heroGroup">
            <div class="name-aura" id="nameAura" aria-hidden="true"></div>
            <h1 class="hero-name" id="heroName" aria-label="OneLastChanc3"></h1>
          </div>

          <nav class="socials" id="socials" aria-label="Social links">
            <a
              class="social-link"
              data-platform="linkedin"
              href="https://www.linkedin.com/"
              target="_blank"
              rel="noreferrer"
              aria-label="LinkedIn"
            >
              <span class="icon-shell" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-12h4v2.1A4.8 4.8 0 0 1 16 8Z" />
                  <path d="M2 9h4v12H2z" />
                  <circle cx="4" cy="4" r="2" />
                </svg>
              </span>
              <span class="social-label">LinkedIn</span>
            </a>
            <a
              class="social-link"
              data-platform="github"
              href="https://github.com/"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub"
            >
              <span class="icon-shell" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path
                    d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.2-3.37-1.2-.45-1.18-1.1-1.49-1.1-1.49-.9-.63.07-.62.07-.62 1 .08 1.53 1.06 1.53 1.06.88 1.55 2.31 1.1 2.87.84.09-.66.35-1.1.63-1.35-2.22-.26-4.56-1.14-4.56-5.08 0-1.13.39-2.05 1.03-2.78-.1-.27-.45-1.33.1-2.77 0 0 .84-.28 2.75 1.06A9.33 9.33 0 0 1 12 6.9c.85 0 1.7.12 2.5.35 1.9-1.34 2.74-1.06 2.74-1.06.56 1.44.21 2.5.11 2.77.64.73 1.03 1.65 1.03 2.78 0 3.95-2.35 4.81-4.6 5.06.36.32.68.96.68 1.94 0 1.4-.01 2.53-.01 2.88 0 .27.18.6.69.49A10.27 10.27 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"
                  />
                </svg>
              </span>
              <span class="social-label">GitHub</span>
            </a>
            <a
              class="social-link"
              data-platform="instagram"
              href="https://www.instagram.com/"
              target="_blank"
              rel="noreferrer"
              aria-label="Instagram"
            >
              <span class="icon-shell" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="3" width="18" height="18" rx="5" />
                  <circle cx="12" cy="12" r="4.2" />
                  <circle cx="17.4" cy="6.6" r="0.8" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span class="social-label">Instagram</span>
            </a>
            <a
              class="social-link"
              data-platform="youtube"
              href="https://www.youtube.com/"
              target="_blank"
              rel="noreferrer"
              aria-label="YouTube"
            >
              <span class="icon-shell" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M22 12s0-3.18-.41-4.71a2.96 2.96 0 0 0-2.08-2.1C17.99 4.75 12 4.75 12 4.75s-5.99 0-7.51.44a2.96 2.96 0 0 0-2.08 2.1C2 8.82 2 12 2 12s0 3.18.41 4.71a2.96 2.96 0 0 0 2.08 2.1c1.52.44 7.51.44 7.51.44s5.99 0 7.51-.44a2.96 2.96 0 0 0 2.08-2.1C22 15.18 22 12 22 12Z" />
                  <path d="m10 15.5 5-3.5-5-3.5v7Z" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span class="social-label">YouTube</span>
            </a>
          </nav>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
